<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VELOCITY | Showroom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #D4AF37;
            --bg-dark: #080808;
            --card-bg: #141414;
            --glass: rgba(20, 20, 20, 0.8);
            --border: 1px solid rgba(212, 175, 55, 0.15);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 80%);
            color: #f0f0f0;
            font-family: 'Montserrat', sans-serif;
            height: 100vh; /* Lock height */
            overflow: hidden; /* Disable page scroll */
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER (Fixed Top) --- */
        header {
            height: 80px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        .brand {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            color: #fff;
            letter-spacing: 3px;
        }
        .brand span { color: var(--gold); }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        /* --- FILTERS & SEARCH --- */
        .filter-btn {
            background: transparent;
            color: #888;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
            padding: 5px 0;
            position: relative;
        }

        .filter-btn:hover, .filter-btn.active { color: var(--gold); }
        
        .filter-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 1px; background: var(--gold);
        }

        .search-box {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            font-family: inherit;
            width: 200px;
            outline: none;
            transition: 0.3s;
        }
        .search-box:focus { background: rgba(255,255,255,0.2); width: 240px; }

        /* --- MAIN GALLERY (Horizontal Scroll) --- */
        main {
            flex: 1; /* Takes remaining height */
            display: flex;
            align-items: center; /* Center vertically */
            overflow-x: auto; /* Horizontal scroll enabled */
            padding: 0 60px;
            gap: 40px;
            scroll-behavior: smooth;
        }

        /* Hide scrollbar for cleaner look */
        main::-webkit-scrollbar { display: none; }
        main { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- CARD DESIGN --- */
        .card {
            min-width: 320px;
            height: 450px;
            background: var(--card-bg);
            border: var(--border);
            position: relative;
            cursor: pointer;
            transition: 0.4s ease;
            display: flex;
            flex-direction: column;
            border-radius: 4px;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border-color: var(--gold);
            z-index: 5;
        }

        .card-img {
            height: 65%;
            width: 100%;
            object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .card-info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-cat { color: var(--gold); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .card-name { margin: 0; font-size: 1.4rem; font-family: 'Cinzel', serif; }
        .card-price { margin-top: 10px; color: #888; font-size: 1rem; }

        /* --- MODAL (Overlay) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show { opacity: 1; }

        .modal-content {
            background: #111;
            width: 900px;
            max-width: 90%;
            display: flex;
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            position: relative;
        }

        .modal-left { width: 55%; }
        .modal-left img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .modal-right { 
            width: 45%; padding: 40px; 
            display: flex; flex-direction: column; justify-content: center;
        }

        .close-modal {
            position: absolute; top: 15px; right: 20px;
            font-size: 30px; cursor: pointer; color: #fff; z-index: 10;
        }
        .close-modal:hover { color: var(--gold); }

        .specs-row {
            display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid #333; padding-top: 20px;
        }
        .spec h4 { color: var(--gold); margin: 0; font-size: 1.1rem; }
        .spec p { margin: 5px 0 0; font-size: 0.7rem; color: #666; letter-spacing: 1px; }

        .btn-buy {
            margin-top: 30px;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-buy:hover { background: #fff; }

    </style>
</head>
<body>

    <header>
        <div class="brand">VELOCITY<span>.</span></div>
        
        <div class="controls">
            <button class="filter-btn active" onclick="filter('all', this)">Collection</button>
            <button class="filter-btn" onclick="filter('Supercar', this)">Supercars</button>
            <button class="filter-btn" onclick="filter('JDM', this)">JDM</button>
            <input type="text" id="search" class="search-box" placeholder="Find model..." onkeyup="search()">
        </div>
    </header>

    <main id="gallery-track">
        </main>

    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModalDirect()">&times;</span>
            <div class="modal-left">
                <img id="m-img" src="" alt="">
            </div>
            <div class="modal-right">
                <span id="m-cat" class="card-cat">Category</span>
                <h2 id="m-name" style="margin: 5px 0; font-family: 'Cinzel'">Name</h2>
                <h3 id="m-price" style="color:#fff; font-weight:300;">$0</h3>
                <p style="color:#888; font-size: 0.9rem; line-height: 1.5; margin-top: 20px;">
                    Designed for the ultimate driving experience. Precision engineering meets luxury in this masterpiece of automotive technology.
                </p>
                <div class="specs-row">
                    <div class="spec"><h4>3.2s</h4><p>0-60 MPH</p></div>
                    <div class="spec"><h4>205</h4><p>TOP SPEED</p></div>
                    <div class="spec"><h4>AWD</h4><p>DRIVETRAIN</p></div>
                </div>
                <button class="btn-buy" onclick="alert('Dealer Contacted')">Request Pricing</button>
            </div>
        </div>
    </div>

    <script>
        // DATA
        const cars = [
            { id: 1, name: "Audi R8 V10", cat: "Supercar", price: "$160,000", img: "img1.png" },
            { id: 2, name: "Toyota Supra", cat: "JDM", price: "$85,000", img: "img2.png" },
            { id: 3, name: "Lamborghini", cat: "Supercar", price: "$500,000", img: "img3.png" },
            { id: 4, name: "Porsche 911", cat: "Supercar", price: "$180,000", img: "img4.png" },
            { id: 5, name: "Ferrari 488", cat: "Supercar", price: "$280,000", img: "img1.png" }, // Placeholder img
            { id: 6, name: "Nissan GTR", cat: "JDM", price: "$115,000", img: "img2.png" }      // Placeholder img
        ];

        const track = document.getElementById('gallery-track');
        let displayedCars = [...cars];

        // RENDER
        function render(data) {
            track.innerHTML = "";
            if(data.length === 0) {
                track.innerHTML = "<h3 style='color:#555; margin:auto;'>No models found.</h3>";
                return;
            }

            data.forEach(car => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(car);
                card.innerHTML = `
                    <img src="${car.img}" class="card-img" alt="${car.name}">
                    <div class="card-info">
                        <span class="card-cat">${car.cat}</span>
                        <h3 class="card-name">${car.name}</h3>
                        <div class="card-price">${car.price}</div>
                    </div>
                `;
                track.appendChild(card);
            });
        }

        // FILTER
        function filter(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if(cat === 'all') displayedCars = cars;
            else displayedCars = cars.filter(c => c.cat === cat);
            render(displayedCars);
        }

        // SEARCH
        function search() {
            const q = document.getElementById('search').value.toLowerCase();
            displayedCars = cars.filter(c => c.name.toLowerCase().includes(q));
            render(displayedCars);
        }

        // MOUSE WHEEL SCROLL (Vertical -> Horizontal)
        track.addEventListener("wheel", (evt) => {
            evt.preventDefault();
            track.scrollLeft += evt.deltaY;
        });

        // MODAL LOGIC
        const modal = document.getElementById('modal');
        
        function openModal(car) {
            document.getElementById('m-img').src = car.img;
            document.getElementById('m-name').innerText = car.name;
            document.getElementById('m-cat').innerText = car.cat;
            document.getElementById('m-price').innerText = car.price;
            
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10); // Fade in
        }

        function closeModal(e) {
            if(e.target === modal) closeModalDirect();
        }

        function closeModalDirect() {
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300); // Fade out
        }

        // INIT
        render(cars);

    </script>
</body>
</html>
